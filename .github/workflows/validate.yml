name: validate
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- main.js
      - run: node --check main.js
      - run: npm test
      - run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); JSON.parse(require('fs').readFileSync('versions.json','utf8'))"
