name: sync P0 refresh bundle
on:
  push:
    branches: [fix/sticky-refresh-p0]
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/sync-p0-bundle.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sticky-refresh-p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --check main.js
      - run: npm test
      - name: Update checked-in plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- main.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.js
            git commit -m "build: sync auto refresh reading guard"
            git push origin HEAD:fix/sticky-refresh-p0
          fi
