name: sync v0.3 development bundle
on:
  push:
    branches:
      - dev/trace-explorer-v0.3
    paths:
      - "src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync-v03-bundle.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/trace-explorer-v0.3
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --check main.js
      - run: npm test
      - name: Commit generated development bundle
        shell: bash
        run: |
          if ! git diff --quiet -- main.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.js
            git commit -m "build: sync v0.3 development bundle"
            git push origin HEAD:dev/trace-explorer-v0.3
          fi
